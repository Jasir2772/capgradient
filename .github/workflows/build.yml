name: Build CAPGradientShop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip source
        run: unzip -o GradientShop-source.zip -d .

      - name: Build with Maven
        working-directory: gradientshop
        run: mvn -B clean package

      - name: Upload jar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: GradientShop
          path: gradientshop/target/GradientShop.jar
